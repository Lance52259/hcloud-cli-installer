name: Upload release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload packages to
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      - name: Upload Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          stage=$(mktemp -d)
          missing=0
          copy_named() {
            local source=$1
            local name=$2
            if [[ ! -f "$source" ]]; then
              echo "Missing $source" >&2
              missing=1
              return
            fi
            cp "$source" "$stage/$name"
          }
          copy_named debug/huaweicloud-cli-linux-amd64.tar.gz "hcloud-linux-amd64-${TAG}.tar.gz"
          copy_named debug/huaweicloud-cli-linux-arm64.tar.gz "hcloud-linux-arm64-${TAG}.tar.gz"
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          (
            cd "$stage"
            sha256sum -- hcloud-linux-amd64-${TAG}.tar.gz hcloud-linux-arm64-${TAG}.tar.gz
          ) >"$stage/SHA256SUMS"
          gh release upload "$TAG" \
            "$stage/hcloud-linux-amd64-${TAG}.tar.gz" \
            "$stage/hcloud-linux-arm64-${TAG}.tar.gz" \
            "$stage/SHA256SUMS" \
            --clobber

  setup-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/windows/go.mod

      - name: Build the Windows installer
        env:
          HCLOUD_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: bash installer/windows/build.sh

      - name: Upload the Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "installer/windows/hcloudSetup-windows-x64-${TAG}.exe" --clobber

  setup-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      - name: Build the macOS installers
        env:
          HCLOUD_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: bash installer/macos/pkg/build.sh

      - name: Upload the macOS installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "dist/hcloudsetup-darwin-arm64-${TAG}.pkg" \
            "dist/hcloudsetup-darwin-arm64-${TAG}.dmg" \
            "dist/hcloudsetup-darwin-x64-${TAG}.pkg" \
            "dist/hcloudsetup-darwin-x64-${TAG}.dmg" \
            "dist/hcloudsetup-darwin-universal-${TAG}.pkg" \
            "dist/hcloudsetup-darwin-universal-${TAG}.dmg" \
            --clobber
